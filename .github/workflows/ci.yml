
name: Student MLOps CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python syntax
        run: |
          python -m py_compile app.py student_grades.py train_model.py

      - name: Check code style
        run: |
          flake8 app.py student_grades.py train_model.py --count --select=E9,F63,F7,F82 --show-source --statistics
